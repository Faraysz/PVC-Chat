<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PVC Team Chat</title>
<link rel="icon" type="image/png" href="pvc-team-logo.png">
<style>
  :root{
    --bg:#EDEAE3; --panel:#FFFFFF; --text:#20302B; --muted:#6B7A74;
    --bubble-me:#2F6F5E; --bubble-me-text:#FFFFFF;
    --bubble-other:#FFFFFF; --bubble-other-text:#20302B;
    --accent:#2F6F5E; --border:#DCD7CC; --input-bg:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12181A; --panel:#182422; --text:#EAF1EC; --muted:#8FA39C;
      --bubble-me:#2F6F5E; --bubble-me-text:#FFFFFF;
      --bubble-other:#22302C; --bubble-other-text:#EAF1EC;
      --accent:#3E9C82; --border:#26332F; --input-bg:#182422;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    display:flex;justify-content:center;}
  #app{width:100%;max-width:560px;height:100dvh;display:flex;flex-direction:column;
    background:var(--panel);border-left:1px solid var(--border);border-right:1px solid var(--border);}

  #login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;}
  #login h1{font-size:22px;margin:0;font-weight:600}
  #login p{color:var(--muted);margin:0;font-size:14px;text-align:center;max-width:300px}
  #login input{width:100%;max-width:260px;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--input-bg);color:var(--text);font-size:15px;outline:none;}
  #login input:focus{border-color:var(--accent)}
  #login button{padding:12px 22px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:15px;cursor:pointer;}
  #loginError{color:#C0392B;font-size:13px;min-height:16px}

  header{display:flex;align-items:center;gap:12px;padding:14px 16px;
    padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--accent);color:#fff;flex-shrink:0;}
  header .dot{width:9px;height:9px;border-radius:50%;background:#7CF2C0;flex-shrink:0}
  header .who{font-weight:600;font-size:16px}
  header .logo-small{height:26px;width:auto;flex-shrink:0;background:#fff;border-radius:6px;padding:2px}
  header .status{font-size:12px;opacity:.85}
  header .meta{display:flex;flex-direction:column;gap:2px;flex:1}
  header .leave{background:none;border:none;color:#fff;opacity:.85;font-size:13px;cursor:pointer}

  #messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;}
  .row{display:flex}
  .row.me{justify-content:flex-end}
  .row.other{justify-content:flex-start}
  .bubble{max-width:75%;padding:8px 12px;border-radius:14px;font-size:14.5px;line-height:1.35;
    box-shadow:0 1px 1px rgba(0,0,0,.05);word-wrap:break-word;}
  .row.me .bubble{background:var(--bubble-me);color:var(--bubble-me-text);border-bottom-right-radius:4px}
  .row.other .bubble{background:var(--bubble-other);color:var(--bubble-other-text);border-bottom-left-radius:4px;border:1px solid var(--border)}
  .bubble .sender{display:block;font-size:11.5px;font-weight:600;opacity:.7;margin-bottom:2px}
  .bubble .text{white-space:pre-wrap}
  .bubble .time{display:block;font-size:10px;opacity:.6;margin-top:3px;text-align:right}
  .empty{color:var(--muted);text-align:center;font-size:13px;margin-top:40px}

  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
  .act{background:none;border:none;cursor:pointer;font-size:12px;opacity:.5;padding:0;line-height:1}
  .act:hover{opacity:1}
  .file{margin:4px 0 2px}
  .file-img{max-width:220px;max-height:220px;border-radius:10px;display:block;cursor:pointer;border:1px solid var(--border)}
  .file-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;
    color:var(--accent);background:rgba(0,0,0,.05);padding:6px 10px;border-radius:8px;max-width:100%;word-break:break-all}
  .row.me .file-link{color:#fff;background:rgba(255,255,255,.16)}
  .file-link em{opacity:.65;font-style:normal;font-size:11px;flex-shrink:0}
  .edit-input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);
    font-size:14px;background:var(--input-bg);color:var(--text);outline:none}
  .edit-input:focus{border-color:var(--accent)}
  .edit-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
  .act-wide{border:none;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
  .act-wide.save{background:var(--accent);color:#fff}
  .act-wide.cancel{background:var(--border);color:var(--text)}

  .img-viewer{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;
    z-index:1000;cursor:zoom-out;padding:20px}
  .img-viewer img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain}
  .img-viewer-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.16);color:#fff;border:none;
    border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}

  #composer{display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;}
  #composer input{flex:1;padding:11px 14px;border-radius:20px;border:1px solid var(--border);
    background:var(--input-bg);color:var(--text);font-size:15px;outline:none;}
  #composer input:focus{border-color:var(--accent)}
  #composer button{width:42px;height:42px;border-radius:50%;border:none;background:var(--accent);color:#fff;
    font-size:18px;cursor:pointer;flex-shrink:0;}
  #composer button.ghost{background:transparent;color:var(--accent);border:1px solid var(--border);font-size:16px}
  #composer button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div id="app">

  <div id="login">
    <h1>Chat Tim</h1>
    <p>Masukkan nama kamu. Semua orang yang buka link ini akan berada di ruang obrolan yang sama, secara real-time.</p>
    <input id="nameInput" maxlength="24" placeholder="Nama kamu" autocomplete="off">
    <button id="joinBtn">Masuk</button>
    <div id="loginError"></div>
  </div>

  <div id="chat" style="display:none;flex:1;flex-direction:column;min-height:0">
    <header>
      <img class="logo-small" src="pvc-team-logo.png" alt="PVC Team logo">
      <div class="dot"></div>
      <div class="meta">
        <span class="who">Ruang Tim</span>
        <span class="status" id="statusLine">menghubungkan…</span>
      </div>
      <button class="leave" id="leaveBtn">Keluar</button>
    </header>
    <div id="messages"></div>
    <div id="composer">
      <input id="msgInput" placeholder="Ketik pesan…" autocomplete="off">
      <button id="attachBtn" class="ghost" title="Lampirkan file">📎</button>
      <button id="sendBtn">➤</button>
      <input type="file" id="fileInput" hidden>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
